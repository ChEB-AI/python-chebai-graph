[project]
name = "chebai-graph"
description = "GNNs for ChEB-AI"
readme = "README.md"
version = "1.2.2"
authors = [
    { name = "Martin Glauer", email = "martin.glauer@ovgu.de" }
]
dependencies = [
    "chebai>=1.4.0",
    "chebi_utils>=0.4",
    "descriptastorus",
    # below packages need to manually installed as mentioned in readme
    # torch-geometric
    # torch_scatter
]
requires-python = ">=3.10"


[project.optional-dependencies]
dev = [
    "tox",
    "omegaconf",
    "chebi_utils",
]

linters = [
    "ruff",
    "pre-commit",
]

wandb = ["wandb"]

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.2,<4"]

[project.entry-points.'chebai.plugins']
models = 'chebai_graph.models'
