class_path: chebai_graph.models.GINEAMGPoolGraphPred
init_args:
  optimizer_kwargs:
    lr: 1e-3
  config:
    in_channels: 203 # number of node/atom properties
    hidden_channels: 512
    out_channels: 512
    num_layers: 5
    edge_dim: 12 # number of bond properties
    train_eps: true
    use_himol_model: true
    norm: batch_norm
  n_linear_layers: 2
  lin_hidden_dim: 256
