class_path: chebai_graph.models.GATAugNodePoolGraphPred
init_args:
  optimizer_kwargs:
    lr: 1e-3
  config:
    in_channels: 203 # number of node/atom properties
    hidden_channels: 256
    out_channels: 512
    num_layers: 4
    edge_dim: 12 # number of bond properties
    heads: 8  # the number of heads should be divisible by output channels (hidden channels if output channel not given)
    v2: True  # This uses `torch_geometric.nn.conv.GATv2Conv` convolution layers, set False to use `GATConv`
    dropout: 0
  n_linear_layers: 1
